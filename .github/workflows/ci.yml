name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  web:
    # The Studio bundle is committed (installs never need Node); fail if it is
    # stale relative to web/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: committed bundle is up to date
        run: git diff --exit-code -- msts_trader/ui/static || (echo "::error::run 'cd web && npm run build' and commit msts_trader/ui/static" && exit 1)

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # one Windows leg: the prompt layer, console encoding, and paths
          # all behave differently there (and have broken before)
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install (with all optional brokers + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: ruff
        run: |
          ruff check msts_trader tests
          ruff format --check msts_trader

      - name: pytest
        run: pytest -v
      - name: cli renders
        run: msts-trader --version
      - name: dependency tree consistent
        run: pip check
      - name: package builds + metadata valid
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: wheel ships the Studio bundle
        shell: bash
        run: python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'msts_trader/ui/static/index.html' in n else 'Studio bundle missing from wheel')"
